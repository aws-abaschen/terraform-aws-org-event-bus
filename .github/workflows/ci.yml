name: ci

# Offline checks only: format, validate, mocked-provider tests.
# No AWS credentials are used and nothing is applied.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.15"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - modules/central-bus
          - modules/spoke-connection
          - modules/central-bus-classic
          - modules/spoke-connection-classic
          - examples/classic
          - examples/complete
          - examples/deployer-role
          - examples/guardrails
          - examples/proof-of-concept
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.15"
          terraform_wrapper: false
      - run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}
      - run: terraform validate
        working-directory: ${{ matrix.dir }}
      - name: terraform test
        if: startsWith(matrix.dir, 'modules/')
        run: terraform test
        working-directory: ${{ matrix.dir }}
